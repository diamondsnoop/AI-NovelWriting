[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-novel-system"
version = "0.1.0"
description = "First-pass skeleton for a long-form novel creation system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
novel = "novelos.interaction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
